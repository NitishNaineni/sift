[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cudasift"
version = "0.1.0"
description = "CUDA-accelerated SIFT feature detection and extraction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SIFT CUDA Team"}
]
keywords = ["sift", "cuda", "computer-vision", "feature-detection", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "numba>=0.56.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/cudasift"
Documentation = "https://github.com/yourusername/cudasift#readme"
Repository = "https://github.com/yourusername/cudasift"
Issues = "https://github.com/yourusername/cudasift/issues"

[tool.setuptools]
packages = ["cudasift"]

[tool.setuptools.package-data]
cudasift = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false
reportIndexIssue = false
ignore = ["cudasift/kernels.py", "tests/test_sift_unittest.py"]
